# Configuration file for the timeseries plots

spacecrafts = [
    "IMAP",
    "SO",
    "SOLAR-1",
    "DSCOVR",
] # List of all spacecrafts to plot traces for
default_spacecraft = "IMAP" # The spacecraft to display as default

[[plots]]
title = "Magnetic field"
unit = "nT"

[plots.measurements.bx_gse]
label = "Bx GSE"
traces = {IMAP = "red", SO = "blue", DSCOVR = "green", "SOLAR-1" = "black"}

[plots.measurements.by_gse]
label = "By GSE"
traces = {IMAP = "indianred", SO = "dodgerblue", "SOLAR-1" = "darkslategray", DSCOVR = "lightgreen"}

[plots.measurements.bz_gse]
label = "Bz GSE"
traces = {IMAP = "lightsalmon", SO = "powderblue", "SOLAR-1" = "lightslategray", DSCOVR = "darkgreen"}

[[plots]]
title = "Phi GSE"
unit = "deg"

[plots.measurements.phi_gse]
label = "Phi GSE"
traces = {IMAP = "red", SO = "blue", "SOLAR-1" = "black", DSCOVR = "green"}

[[plots]]
title = "Theta GSE"
unit = "deg"

[plots.measurements.theta_gse]
label = "Theta GSE"
traces = {IMAP = "red", SO = "blue", "SOLAR-1" = "black", DSCOVR = "green"}

[[plots]]
title = "Density"
unit = "1/cm³"

[plots.measurements.density]
label = "Density"
traces = {IMAP = "red", SO = "blue", "SOLAR-1" = "black", DSCOVR = "green"}

[[plots]]
title = "Speed"
unit = "km/s"

[plots.measurements.speed]
label = "Speed"
traces = {IMAP = "red", SO = "blue", "SOLAR-1" = "black", DSCOVR = "green"}

[[plots]]
title = "Temperature"
unit = "k"

[plots.measurements.temperature]
label = "Temperature"
traces = {IMAP = "red", SO = "blue", "SOLAR-1" = "black", DSCOVR = "green"}
