[project]
name = "solar_data_viewer"
dynamic = ["version"]
description = "A Django web app for displaying solar weather data."
authors = [
    {name = "Stephanie Wills", email = "stephanie.wills13@imperial.ac.uk"},
    {name = "Imperial College London RSE Team", email = "ict-rse-team@imperial.ac.uk"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"

dependencies = [
    "azure-monitor-opentelemetry>=1.8.8",
    "bokeh>=3.8.2",
    "django>=6.0.5",
    "gunicorn>=26.0.0",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "sunpy>=7.1.2",
    "whitenoise>=6.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "mypy>=1.20.2",
    "pip-tools>=7.5.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-django>=4.11.1",
    "pandas-stubs>=2.3.3.260113",
    "django-stubs[compatible-mypy]>=6.0.4",
    "model-bakery>=1.23.3",
]
doc = [
    "mkdocs>=1.6.1",
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=2.0.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-section-index>=0.3.12",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
disallow_any_explicit = true
disallow_any_generics = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = [".venv/", "docs/", "manage.py"]

[tool.django-stubs]
django_settings_module = "solar_data_viewer.settings"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["sunpy.*", "astropy.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
addopts = "-v -p no:warnings --cov=solar_data_viewer --cov-branch --cov-report=html --cov-report=xml --nomigrations --doctest-modules --ignore=solar_data_viewer/__main__.py --ignore=docs/ --ignore=solar_data_viewer/settings/ --ignore=main/data/"
DJANGO_SETTINGS_MODULE = "solar_data_viewer.settings"
FAIL_INVALID_TEMPLATE_VARS = true

[tool.ruff]
target-version = "py313"
exclude = ["main/migrations/"]

[tool.ruff.lint]
select = [
    "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
]


[build-system]
requires = ["setuptools>=82.0.1", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["solar_data_viewer"]

[tool.setuptools_scm]
